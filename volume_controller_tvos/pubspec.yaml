name: volume_controller_tvos
description: A Flutter volume plugin for multiple platform to control system volume.
version: 3.6.0
homepage: https://github.com/kurenai7968/volume_controller

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      tvos:
        pluginClass: VolumeControllerPlugin
